services:
  - type: web
    name: synapse-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: synapse-db
          property: connectionString
      - key: NODE_ENV
        value: production

  - type: web
    name: synapse-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: synapse-backend
          property: host
          format: https://{host}/api

databases:
  - name: synapse-db
    databaseName: synapse
    user: synapse_user
    plan: free
